# This machine has 7 GB RAM. -Xmx8G + 4G metaspace demanded ~12 GB and crashed
# the Gradle daemon (OutOfMemory in arena.cpp). Keep the JVM within physical RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation builds relative paths between plugin sources
# (in the pub cache on C:) and the project (on D:). Cross-drive paths throw
# "this and base files have different roots" and fail the build. Disabling
# incremental compilation avoids the cross-drive cache entirely.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
