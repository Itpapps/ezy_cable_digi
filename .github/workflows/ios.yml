name: Flutter iOS Build

on:
  push:
    branches:
      - main
      - master
      - firstpatch
  workflow_dispatch: # allows manual runs from the Actions tab (any branch)

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      # No manual `pod install` step: `flutter build ios` generates the iOS
      # Podfile (this project has none yet) and runs CocoaPods itself.
      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign
